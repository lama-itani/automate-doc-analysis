[project]
name = "ps06"
version = "0.1.0"
description = "PS-06 Automation of Immigration Case Files — per-invocation token isolation + status-table-driven orchestration"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ps06*"]

[tool.pytest.ini_options]
testpaths = ["tests"]